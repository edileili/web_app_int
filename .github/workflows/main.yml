name: CI/CD Pipeline - Node.js & Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      # Ejecutar pruebas limpias sin cobertura pesada que cause el segfault
      - name: Ejecutar batería de pruebas
        run: npm test

      # 5. Iniciar sesión en Docker Hub de forma segura usando Secrets
      - name: Autenticación en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Configurar Docker Buildx (para compilación avanzada)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Compilar y publicar imagen en Docker Hub con tags :latest y :${{ github.sha }}
      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/webapp:latest
            ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.sha }}
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Solo despliega en push a main

    steps:
      - name: Conectar a EC2 y desplegar contenedor
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker stop mi-api-app || true
            sudo docker rm mi-api-app || true
            sudo docker rmi ${{ secrets.DOCKER_USERNAME }}/webapp:latest || true

            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/webapp:latest
            
            # 4. Levantar el nuevo contenedor mapeando el puerto 80 del servidor al puerto interno de la app (ej. 3000)
            sudo docker run -d --name mi-api-app -p 80:3000 ${{ secrets.DOCKER_USERNAME }}/webapp:latest