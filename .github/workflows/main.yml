name: CI/CD Pipeline - Node.js & Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Instalar y reconstruir dependencias
        run: |
          npm install
          npm rebuild better-sqlite3

      # 4. Ejecutar pruebas y mostrar cobertura
      - name: Ejecutar batería de pruebas y cobertura
        run: npm test

      # 5. Iniciar sesión en Docker Hub de forma segura usando Secrets
      - name: Autenticación en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Configurar Docker Buildx (para compilación avanzada)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Compilar y publicar imagen en Docker Hub con tags :latest y :${{ github.sha }}
      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/webapp:latest
            ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.sha }}