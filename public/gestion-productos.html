<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de productos | Inventario</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav id="navbar"></nav>
    <main id="pagina-gestion">
        <h1 id="titulo-pagina">Gestión de productos</h1>

        <div class="columnas">
            <section class="tarjeta" id="seccion-producto-form">
                <h2 id="producto-form-titulo">Nuevo producto</h2>
                <div id="producto-error" class="mensaje error oculto"></div>
                <div id="producto-exito" class="mensaje exito oculto"></div>
                <form id="producto-form" novalidate>
                    <input id="producto-id" type="hidden">
                    <div class="campo">
                        <label for="producto-nombre">Nombre</label>
                        <input id="producto-nombre" type="text">
                    </div>
                    <div class="campo">
                        <label for="producto-precio">Precio</label>
                        <input id="producto-precio" type="number" step="0.01" min="0">
                    </div>
                    <div class="campo">
                        <label for="producto-stock">Stock</label>
                        <input id="producto-stock" type="number" step="1" min="0" value="0">
                    </div>
                    <div class="campo">
                        <label for="producto-categoria">Categoría</label>
                        <select id="producto-categoria"><option value="">Selecciona…</option></select>
                    </div>
                    <div class="fila-botones">
                        <button id="producto-guardar" type="submit">Guardar</button>
                        <button id="producto-cancelar" type="button" class="secundario">Cancelar</button>
                    </div>
                </form>
            </section>

            <section class="tarjeta" id="seccion-categoria-form">
                <h2 id="categoria-form-titulo">Categorías</h2>
                <div id="categoria-error" class="mensaje error oculto"></div>
                <div id="categoria-exito" class="mensaje exito oculto"></div>
                <form id="categoria-form" novalidate>
                    <input id="categoria-id" type="hidden">
                    <div class="campo">
                        <label for="categoria-nombre">Nombre de la categoría</label>
                        <input id="categoria-nombre" type="text">
                    </div>
                    <div class="fila-botones">
                        <button id="categoria-guardar" type="submit">Guardar categoría</button>
                        <button id="categoria-cancelar" type="button" class="secundario">Cancelar</button>
                    </div>
                </form>
                <div class="tabla-wrap">
                    <table id="tabla-categorias">
                        <thead><tr><th>ID</th><th>Nombre</th><th>Acciones</th></tr></thead>
                        <tbody id="categorias-body"></tbody>
                    </table>
                </div>
                <p id="categorias-vacio" class="vacio oculto">Aún no hay categorías.</p>
            </section>
        </div>

        <section class="tarjeta">
            <h2>Listado</h2>
            <div class="tabla-wrap">
                <table id="tabla-gestion">
                    <thead>
                        <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Categoría</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="gestion-body"></tbody>
                </table>
            </div>
            <p id="gestion-vacio" class="vacio oculto">No hay productos registrados.</p>
        </section>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/gestion.js"></script>
</body>
</html>
